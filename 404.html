<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Ndung'u Kinyanjui</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#1D0225">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%231D0225;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%23260B68;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' ry='20' fill='url(%23grad)'/%3E%3Ctext x='50' y='72' font-family='BBH Sans Bogle, Arial, sans-serif' font-size='65' font-weight='bold' fill='%2368A2EB' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BBH+Sans+Bogle&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-midnight-purple: #1d0225;
        --color-deep-indigo: #260b68;
        --color-electric-blue: #4c5dd7;
        --color-neon-magenta: #c231c9;
        --color-soft-sky-blue: #68a2eb;
        --color-text: #e6e6fa;
        --color-muted: #9b9bb5;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Lato", sans-serif;
        background: linear-gradient(135deg, #1d0225 0%, #260b68 100%);
        color: var(--color-text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
      }

      .error-code {
        font-family: "BBH Sans Bogle", sans-serif;
        font-size: clamp(5rem, 20vw, 10rem);
        line-height: 1;
        background: linear-gradient(
          90deg,
          var(--color-soft-sky-blue),
          var(--color-neon-magenta)
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 40px rgba(104, 162, 235, 0.3);
      }

      h1 {
        font-family: "BBH Sans Bogle", sans-serif;
        font-weight: 400;
        font-size: clamp(1.5rem, 5vw, 2.2rem);
        color: var(--color-soft-sky-blue);
        margin: 1rem 0;
      }

      p {
        color: var(--color-muted);
        max-width: 480px;
        line-height: 1.7;
        margin: 0 auto 2.5rem auto;
      }

      .btn {
        display: inline-block;
        padding: 0.8rem 2rem;
        border: 2px solid var(--color-neon-magenta);
        color: var(--color-neon-magenta);
        text-decoration: none;
        font-weight: 600;
        border-radius: 8px;
        transition: all 0.3s ease;
      }

      .btn:hover {
        background: var(--color-neon-magenta);
        color: #fff;
        box-shadow: 0 0 20px rgba(194, 49, 201, 0.5);
        transform: translateY(-2px);
      }

      @media (prefers-reduced-motion: reduce) {
        .btn {
          transition: none;
        }
        .btn:hover {
          transform: none;
        }
      }
    </style>
</head>
<body>
    <main>
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for has drifted off into the cloud. Let's get you back on track.</p>
        <a href="/" class="btn">Back to Home</a>
    </main>
</body>
</html>
